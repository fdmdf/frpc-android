<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 660" width="340" height="660" role="img" aria-label="Frpc-Android 界面示意图">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#1f4fd0"/>
    </linearGradient>
  </defs>

  <!-- phone shell -->
  <rect x="8" y="8" width="324" height="644" rx="34" fill="#111827"/>
  <rect x="16" y="16" width="308" height="628" rx="28" fill="#f5f7fb"/>

  <!-- status bar -->
  <rect x="16" y="16" width="308" height="28" rx="28" fill="#ffffff"/>
  <text x="34" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#374151">09:41</text>
  <text x="278" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#374151">4G  ▮▮▮</text>

  <!-- app bar -->
  <rect x="16" y="44" width="308" height="46" fill="url(#hdr)"/>
  <text x="34" y="72" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Frpc-Android</text>
  <circle cx="292" cy="67" r="6" fill="#4ade80"/>

  <!-- proxy card 1 -->
  <rect x="30" y="106" width="280" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="46" y="130" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">ssh-home</text>
  <rect x="240" y="118" width="54" height="20" rx="10" fill="#ecfdf5"/>
  <circle cx="252" cy="128" r="4" fill="#16a34a"/>
  <text x="260" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">online</text>
  <text x="46" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">tcp · 127.0.0.1:22</text>
  <text x="46" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">remote 6000</text>
  <rect x="196" y="158" width="98" height="22" rx="6" fill="#eef2ff"/>
  <text x="222" y="173" font-family="system-ui, sans-serif" font-size="11" fill="#4338ca">stop</text>

  <!-- proxy card 2 -->
  <rect x="30" y="204" width="280" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="46" y="228" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">nas-web</text>
  <rect x="240" y="216" width="54" height="20" rx="10" fill="#ecfdf5"/>
  <circle cx="252" cy="226" r="4" fill="#16a34a"/>
  <text x="260" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">online</text>
  <text x="46" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">http · 127.0.0.1:8080</text>
  <text x="46" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">nas.example.com</text>
  <rect x="196" y="256" width="98" height="22" rx="6" fill="#eef2ff"/>
  <text x="222" y="271" font-family="system-ui, sans-serif" font-size="11" fill="#4338ca">stop</text>

  <!-- running banner -->
  <rect x="30" y="302" width="280" height="52" rx="12" fill="#111827"/>
  <circle cx="52" cy="328" r="6" fill="#4ade80"/>
  <text x="68" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">frpc v0.71.1 running</text>
  <text x="68" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">foreground service · auto reconnect</text>

  <!-- log preview -->
  <rect x="30" y="366" width="280" height="106" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="46" y="388" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151">log</text>
  <text x="46" y="408" font-family="ui-monospace, monospace" font-size="9.5" fill="#6b7280">[I] login to server success</text>
  <text x="46" y="424" font-family="ui-monospace, monospace" font-size="9.5" fill="#6b7280">[I] start proxy ssh-home</text>
  <text x="46" y="440" font-family="ui-monospace, monospace" font-size="9.5" fill="#6b7280">[I] start proxy nas-web</text>
  <text x="46" y="456" font-family="ui-monospace, monospace" font-size="9.5" fill="#6b7280">[I] heartbeat ok</text>

  <!-- floating action button -->
  <circle cx="278" cy="500" r="24" fill="#2f6df6"/>
  <text x="278" y="506" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff">+</text>

  <!-- bottom navigation -->
  <rect x="16" y="576" width="308" height="68" fill="#ffffff"/>
  <line x1="16" y1="576" x2="324" y2="576" stroke="#e5e7eb"/>
  <g font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
    <rect x="46" y="588" width="22" height="22" rx="5" fill="#2f6df6"/>
    <text x="57" y="620" fill="#2f6df6">proxy</text>
    <rect x="124" y="588" width="22" height="22" rx="5" fill="#d1d5db"/>
    <text x="135" y="620" fill="#6b7280">log</text>
    <rect x="202" y="588" width="22" height="22" rx="5" fill="#d1d5db"/>
    <text x="213" y="620" fill="#6b7280">config</text>
    <rect x="280" y="588" width="22" height="22" rx="5" fill="#d1d5db"/>
    <text x="291" y="620" fill="#6b7280">about</text>
  </g>
</svg>
