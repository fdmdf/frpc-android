<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <rect width="390" height="844" fill="#FDFCFF"/>

  <!-- 主题 -->
  <rect x="16" y="12" width="358" height="100" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="40" font-size="15" font-weight="500" fill="#0B57D0">主题</text>
  <rect x="32" y="50" width="326" height="50" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="48" y="81" font-size="14" fill="#1A1C1E">跟随系统</text>
  <text x="342" y="81" font-size="12" fill="#43474E" text-anchor="end">▾</text>

  <!-- 开机自启 -->
  <rect x="16" y="122" width="358" height="150" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="150" font-size="15" font-weight="500" fill="#0B57D0">开机自启</text>
  <text x="32" y="174" font-size="13" fill="#1A1C1E">开机自启</text>
  <rect x="306" y="162" width="52" height="30" rx="15" fill="#0B57D0"/>
  <circle cx="343" cy="177" r="11" fill="#FFFFFF"/>
  <text x="32" y="194" font-size="11" fill="#43474E">开机后自动启动默认配置的 frpc</text>
  <rect x="32" y="204" width="326" height="48" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="48" y="233" font-size="13" fill="#1A1C1E">默认配置：家里的 frps</text>
  <text x="342" y="233" font-size="12" fill="#43474E" text-anchor="end">▾</text>

  <!-- 电池优化 -->
  <rect x="16" y="282" width="358" height="68" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="310" font-size="15" font-weight="500" fill="#0B57D0">忽略电池优化</text>
  <text x="32" y="332" font-size="12" fill="#43474E">已加入电池优化白名单</text>

  <!-- 日志 -->
  <rect x="16" y="360" width="358" height="100" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="388" font-size="15" font-weight="500" fill="#0B57D0">日志</text>
  <text x="32" y="412" font-size="13" fill="#1A1C1E">显示状态接口访问日志</text>
  <rect x="306" y="400" width="52" height="30" rx="15" fill="#C9CDD4"/>
  <circle cx="321" cy="415" r="11" fill="#FFFFFF"/>
  <text x="32" y="430" font-size="11" fill="#43474E">frpc 每 4 秒被轮询一次会产生两条日志，</text>
  <text x="32" y="446" font-size="11" fill="#43474E">默认隐藏；排查状态接口时再打开</text>

  <!-- 引擎 -->
  <rect x="16" y="470" width="358" height="136" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="498" font-size="15" font-weight="500" fill="#0B57D0">frpc 引擎</text>
  <text x="32" y="520" font-size="12" fill="#1A1C1E">版本 0.71.1（arm64-v8a）</text>
  <text x="32" y="540" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#43474E">引擎路径：/data/app/…/lib/arm64/libfrpc.so（就绪）</text>
  <text x="32" y="562" font-size="11" fill="#43474E">引擎以 libfrpc.so 形式随应用分发（安装时解压到系统</text>
  <text x="32" y="578" font-size="11" fill="#43474E">目录执行，规避 Android 10+ 数据目录执行限制），升级</text>
  <text x="32" y="594" font-size="11" fill="#43474E">应用即可更新引擎。32 位设备不受支持。</text>

  <!-- 关于 -->
  <rect x="16" y="616" width="358" height="140" rx="16" fill="#FFFFFF" stroke="#E6E8EB"/>
  <text x="32" y="644" font-size="15" font-weight="500" fill="#0B57D0">关于</text>
  <text x="32" y="668" font-size="13" fill="#1A1C1E">版本 1.0.10</text>
  <text x="32" y="690" font-size="11" fill="#43474E">基于 Kotlin Multiplatform + Jetpack Compose 的 frpc</text>
  <text x="32" y="706" font-size="11" fill="#43474E">安卓客户端，逻辑层跨 Android/JVM 双端。</text>
  <text x="32" y="728" font-size="11" fill="#43474E">frpc 0.71.1 · Kotlin Multiplatform + Compose</text>

  <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
  <line x1="0" y1="768" x2="390" y2="768" stroke="#E6E8EB"/>

  <g>
    <rect x="30" y="784" width="9" height="9" rx="2" fill="#8E9196"/>
    <rect x="42" y="784" width="9" height="9" rx="2" fill="#8E9196"/>
    <rect x="30" y="796" width="9" height="9" rx="2" fill="#8E9196"/>
    <rect x="42" y="796" width="9" height="9" rx="2" fill="#8E9196"/>
    <text x="39" y="826" font-size="11" fill="#8E9196" text-anchor="middle">主页</text>

    <rect x="108" y="784" width="19" height="8" rx="2" fill="#8E9196"/>
    <rect x="108" y="796" width="19" height="8" rx="2" fill="#8E9196"/>
    <text x="117" y="826" font-size="11" fill="#8E9196" text-anchor="middle">配置</text>

    <rect x="186" y="786" width="18" height="2.4" rx="1.2" fill="#8E9196"/>
    <rect x="186" y="792" width="18" height="2.4" rx="1.2" fill="#8E9196"/>
    <rect x="186" y="798" width="18" height="2.4" rx="1.2" fill="#8E9196"/>
    <text x="195" y="826" font-size="11" fill="#8E9196" text-anchor="middle">日志</text>

    <polyline points="266,799 271,788 276,795 281,788 286,799" fill="none" stroke="#8E9196" stroke-width="2"/>
    <text x="273" y="826" font-size="11" fill="#8E9196" text-anchor="middle">监控</text>

    <circle cx="351" cy="791" r="6.5" fill="#0B57D0" fill-opacity="0.16"/>
    <circle cx="351" cy="791" r="6.5" fill="none" stroke="#0B57D0" stroke-width="2"/>
    <circle cx="351" cy="791" r="2.2" fill="#0B57D0"/>
    <text x="351" y="826" font-size="11" fill="#0B57D0" text-anchor="middle">设置</text>
  </g>
</svg>
