<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <rect width="390" height="844" fill="#FDFCFF"/>

  <text x="24" y="62" font-size="20" fill="#1A1C1E">←</text>
  <text x="60" y="62" font-size="17" font-weight="500" fill="#1A1C1E">新建配置</text>
  <text x="362" y="62" font-size="14" font-weight="500" fill="#0B57D0" text-anchor="end">保存</text>

  <text x="24" y="104" font-size="14" font-weight="500" fill="#0B57D0">服务器地址</text>

  <rect x="16" y="118" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="152" font-size="14" fill="#6B7075">配置名称</text>

  <rect x="16" y="186" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="220" font-size="14" fill="#6B7075">服务器地址</text>

  <rect x="16" y="254" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#0B57D0" stroke-width="2"/>
  <rect x="30" y="246" width="76" height="16" fill="#FFFFFF"/>
  <text x="34" y="258" font-size="11" fill="#0B57D0">服务器端口</text>
  <text x="34" y="292" font-size="14" fill="#1A1C1E">7000</text>

  <text x="30" y="328" font-size="11" fill="#43474E">tcp/websocket 填 frps 的 bind_port；kcp/quic 时</text>
  <text x="30" y="344" font-size="11" fill="#43474E">须填其对应监听端口</text>

  <rect x="16" y="360" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="394" font-size="14" fill="#6B7075">用户名前缀</text>

  <rect x="16" y="428" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="462" font-size="14" fill="#6B7075">客户端 ID</text>

  <text x="24" y="514" font-size="14" fill="#1A1C1E">首次登录失败即退出</text>
  <text x="24" y="534" font-size="11" fill="#43474E">开启后首次登录失败即退出；关闭则持续重连（手机</text>
  <text x="24" y="550" font-size="11" fill="#43474E">网络频繁切换建议关闭）</text>
  <rect x="312" y="506" width="52" height="30" rx="15" fill="#C9CDD4"/>
  <circle cx="327" cy="521" r="11" fill="#FFFFFF"/>

  <text x="24" y="600" font-size="14" font-weight="500" fill="#0B57D0">认证方式</text>
  <rect x="16" y="614" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="648" font-size="14" fill="#1A1C1E">token</text>
  <text x="350" y="650" font-size="12" fill="#43474E" text-anchor="end">▾</text>

  <rect x="16" y="682" width="358" height="56" rx="8" fill="#FFFFFF" stroke="#B9BEC6"/>
  <text x="34" y="716" font-size="14" fill="#6B7075">认证 Token</text>

  <text x="24" y="760" font-size="14" font-weight="500" fill="#0B57D0">状态监控（本机接口）</text>
  <text x="24" y="792" font-size="14" fill="#1A1C1E">启用状态监控</text>
  <text x="24" y="812" font-size="11" fill="#43474E">在本机 127.0.0.1:7400 开放接口，App 据此读取在线</text>
  <text x="24" y="828" font-size="11" fill="#43474E">状态与真实端口；关闭后仅按日志推断</text>
  <rect x="312" y="772" width="52" height="30" rx="15" fill="#0B57D0"/>
  <circle cx="349" cy="787" r="11" fill="#FFFFFF"/>
</svg>
