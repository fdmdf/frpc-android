name: 功能建议
description: 提出一个改进或新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明使用场景，而不仅是「想要什么」。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你现在是怎么做的？遇到什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 配置管理
        - 运行控制
        - 状态监控
        - 日志
        - 通知
        - Web 控制台
        - 构建 / CI
        - 其他
