name: Build and Release (Android)

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 非 main 分支、非 tag：前端构建 + Rust（Android 目标）编译与单测
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "npm"

      - name: Rewrite SSH git URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci --verbose
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 60000
        timeout-minutes: 15

      - name: Check frontend build
        run: npm run build

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # rusqlite 的 bundled SQLite 是 C 源码，cargo check 也要真编一次，
      # 所以这里必须给出 NDK 的 clang，否则 cc-rs 报找不到 aarch64-linux-android-clang。
      - name: Install NDK 27
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Check Rust (android) and run tests
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cd src-tauri
          cargo check --target aarch64-linux-android --features custom-protocol
          cargo test

  # main 分支：跑一次前端 + Android 目标编译，防止主干被改坏
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "npm"

      - name: Rewrite SSH git URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci --verbose
        timeout-minutes: 15

      - name: Build frontend
        run: npm run build

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install NDK 27
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Check Rust (android)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cd src-tauri
          cargo check --target aarch64-linux-android --features custom-protocol

  # tag：编译 frpc 引擎、打签名 APK 并发布 Release
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # ubuntu runner 自带 SDK，ANDROID_HOME 是打包脚本查找 NDK 的唯一依据
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # secrets 上下文不能用在 if 里，先落到 env 再判断
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "npm"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 不用 android-actions/setup-android：它会去装早已下架的 `tools` 包，
      # 在新版 cmdline-tools 上直接报 "Failed to find package 'tools'" 退出码 1。
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK 27
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Rewrite SSH git URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci --verbose
        timeout-minutes: 15

      - name: Build frontend
        run: npm run build

      # frpc 引擎：从 Go 源码交叉编译 libfrpc.so（arm64）
      - name: Build frpc for Android
        run: node scripts/build-frpc-android.mjs
        env:
          ABIS: arm64-v8a

      # 签名密钥不入库：把 jks 转成 base64 存进 Secrets，这里还原成临时文件。
      # 未配置时脚本会产出未签名 APK，不会让整个流程失败。
      - name: Restore signing keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/frpc-android.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/frpc-android.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: node scripts/build-android-apk.mjs aarch64-linux-android --release

      - name: Rename APK
        run: |
          mkdir -p release-assets
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk \
            "release-assets/Frpc-Android-${GITHUB_REF_NAME#v}-android-arm64.apk"

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
