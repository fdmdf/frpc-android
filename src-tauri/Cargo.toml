[package]
name = "frpc-android"
version = "1.2.8"
description = "FRP Android Client"
authors = ["luckjiawei"]
edition = "2021"

[lib]
name = "frpc_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `tauri build` / `tauri android build` 会自动开启 custom-protocol。
# 绕过 CLI 手动 cargo build 时必须显式带上，否则 tauri 判定为开发模式
# （is_dev() = !cfg!(feature = "custom-protocol")），WebView 会去连 devUrl
# http://localhost:3344 而不是加载随包编译进去的前端资源。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
# Android 没有系统 OpenSSL，统一使用纯 Rust 的 rustls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
anyhow = "1.0"
libc = "0.2"
