[package]
name = "frpc-desktop"
version = "1.2.8"
description = "FRP Desktop Client"
authors = ["luckjiawei"]
edition = "2021"

[lib]
name = "frpc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `tauri build` / `tauri android build` 会自动开启 custom-protocol。
# 绕过 CLI 手动 cargo build 时必须显式带上，否则 tauri 判定为开发模式
# （is_dev() = !cfg!(feature = "custom-protocol")），WebView 会去连 devUrl
# http://localhost:3344 而不是加载随包编译进去的前端资源。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
dirs = "6.0"
anyhow = "1.0"
libc = "0.2"
md5 = "0.7"
futures-util = "0.3"

# Desktop-only dependencies. They either do not compile on Android/iOS
# (rfd pulls in GTK/X11) or expose desktop-only APIs (autostart, tray, sysinfo).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
sysinfo = "0.33"
open = "5.3"
rfd = "0.15"
# 桌面端沿用系统 TLS（schannel/Secure Transport/OpenSSL），行为与旧版一致。
reqwest = { version = "0.12", features = ["default-tls"] }

# Android/iOS 没有 OpenSSL，改用纯 Rust 的 rustls。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
